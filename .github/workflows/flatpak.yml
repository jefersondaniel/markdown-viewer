# Builds the Flatpak when a push or pull request changes something that goes
# into it. The release workflow also calls it with a release tag, and then the
# bundle is attached to that release.
#
# Version and changelog updates are left out on purpose: they only come from
# release pull requests, and merging one builds the Flatpak for the release.
name: Flatpak

on:
  push:
    branches: [main]
    paths: &app-paths
      - "src/**"
      - "subprojects/**"
      - "data/**"
      - "!data/screenshots/**"
      - "meson.build"
      - "build-aux/**"
      - ".github/workflows/flatpak.yml"
  pull_request:
    paths: *app-paths
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Tag of the GitHub release to attach the bundle to
        type: string
        required: false

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    permissions:
      contents: write
    # A newer push to the same branch or pull request makes this build pointless,
    # but a release build always runs to completion.
    concurrency:
      group: flatpak-${{ inputs.release-tag || github.ref }}
      cancel-in-progress: ${{ !inputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag || github.ref }}

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40 # master
        with:
          manifest-path: build-aux/flatpak/io.github.jefersondaniel.MarkdownViewer.json
          bundle: markdown-viewer.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Attach the bundle to the release
        if: inputs.release-tag
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release-tag }}
          files: markdown-viewer.flatpak
          fail_on_unmatched_files: true
          append_body: true
          body: |

            ### Install

            Download **markdown-viewer.flatpak** below, then open it with GNOME Software or run:

            ```sh
            flatpak install --user markdown-viewer.flatpak
            ```

            Installing needs the [Flathub](https://flathub.org/setup) remote, which provides the GNOME runtime.
