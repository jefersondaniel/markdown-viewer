# Builds the Flatpak when a push or pull request changes something that goes
# into it. The release workflow also calls it with a release tag, and then the
# bundle is attached to that release, together with its SHA-256 checksum and a
# signed build provenance attestation that ties it to this workflow and commit.
#
# Version and changelog updates are left out on purpose: they only come from
# release pull requests, and merging one builds the Flatpak for the release.
name: Flatpak

on:
  push:
    branches: [main]
    paths: &app-paths
      - "src/**"
      - "subprojects/**"
      - "data/**"
      - "!data/screenshots/**"
      - "meson.build"
      - "build-aux/**"
      - ".github/workflows/flatpak.yml"
  pull_request:
    paths: *app-paths
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Tag of the GitHub release to attach the bundle to
        type: string
        required: false

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      # Pinned by digest, so the build environment can't change under a tag.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    permissions:
      contents: write
      id-token: write
      attestations: write
    # A newer push to the same branch or pull request makes this build pointless,
    # but a release build always runs to completion.
    concurrency:
      group: flatpak-${{ inputs.release-tag || github.ref }}
      cancel-in-progress: ${{ !inputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag || github.ref }}

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40 # master
        with:
          manifest-path: build-aux/flatpak/io.github.jefersondaniel.MarkdownViewer.json
          bundle: markdown-viewer.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          # A release is built from scratch, with nothing restored from earlier builds.
          cache: ${{ !inputs.release-tag }}

      - name: Compute the checksum
        if: inputs.release-tag
        run: sha256sum markdown-viewer.flatpak > SHA256SUMS

      # GitHub only stores attestations for public repositories (or on GitHub
      # Enterprise Cloud), so this step waits until the repository is public.
      - name: Attest the build provenance
        id: attest
        if: inputs.release-tag && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: markdown-viewer.flatpak

      - name: Write the release notes
        if: inputs.release-tag
        env:
          ATTESTED: ${{ steps.attest.outcome == 'success' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'

          ### Install

          Download **markdown-viewer.flatpak** below, then open it with GNOME Software or run:

          ```sh
          flatpak install --user markdown-viewer.flatpak
          ```

          Installing needs the [Flathub](https://flathub.org/setup) remote, which provides the GNOME runtime.

          ### Verify

          NOTES
          if [ "$ATTESTED" = true ]; then
            cat >> notes.md <<NOTES
          The bundle was built by GitHub Actions from the tagged source. To check that the
          file you downloaded is that build, use the [GitHub CLI](https://cli.github.com):

          \`\`\`sh
          gh attestation verify markdown-viewer.flatpak --repo $REPOSITORY
          \`\`\`

          NOTES
          fi
          cat >> notes.md <<'NOTES'
          To check that the download is complete, run this next to `SHA256SUMS`:

          ```sh
          sha256sum -c SHA256SUMS
          ```
          NOTES

      - name: Attach the bundle to the release
        if: inputs.release-tag
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release-tag }}
          files: |
            markdown-viewer.flatpak
            SHA256SUMS
          fail_on_unmatched_files: true
          append_body: true
          body_path: notes.md
